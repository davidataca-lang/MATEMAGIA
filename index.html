<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MATEMAGIA, un juego matemático para practicar operaciones con retos mágicos." />
    <link rel="stylesheet" href="./src/styles.css" />
    <title>MATEMAGIA</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="game-title">
        <div>
          <p class="eyebrow">✨ Academia de números encantados</p>
          <h1 id="game-title">MATEMAGIA</h1>
          <p class="hero-copy">Practica operaciones, gana estrellas y fortalece tus poderes matemáticos en retos rápidos.</p>
        </div>
        <div class="hero-card" aria-label="Puntuación actual">
          <span class="wand">🪄</span>
          <strong id="score">0</strong>
          <span>conjuros correctos</span>
        </div>
      </section>
      <section class="settings-panel" aria-label="Configuración del reto">
        <label>Operación<select id="operation"></select></label>
        <label>Nivel<select id="difficulty"></select></label>
        <label>Preguntas<select id="totalQuestions"></select></label>
      </section>
      <section class="game-card" aria-live="polite">
        <div id="play-view">
          <div class="game-meta"><span id="question-count">Pregunta 1 de 10</span><span id="streak">Racha: 0</span></div>
          <div class="progress-track" aria-label="Progreso"><div id="progress"></div></div>
          <p class="feedback" id="feedback">Resuelve el conjuro para comenzar.</p>
          <form id="question-form" class="question-form">
            <div class="question" id="question">0 + 0 = ?</div>
            <label class="answer-label">Tu respuesta<input id="answer" inputmode="numeric" autocomplete="off" placeholder="Escribe el resultado" /></label>
            <button type="submit">Lanzar hechizo</button>
          </form>
        </div>
        <div id="result-view" class="result-card hidden">
          <p class="eyebrow">⭐ Reto completado</p>
          <h2 id="result-message"></h2>
          <div class="stars" id="stars" aria-label="Estrellas"></div>
          <p id="result-score"></p>
          <button type="button" id="restart">↻ Jugar otra vez</button>
        </div>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
